name: Deploy

# Builds the static site and syncs it to the VPS on every push to main.
# Required repository secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST         server IP or hostname
#   VPS_USER         SSH user that owns the web root
#   VPS_SSH_KEY      private key of a dedicated deploy key (its .pub is in the user's authorized_keys)
#   VPS_KNOWN_HOSTS  output of `ssh-keyscan -p <port> <host>`, pins the server's host key
# Optional repository variables:
#   VPS_PORT         SSH port (default 22)
#   VPS_PATH         web root (default /var/www/med-rhaima.me)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run generate

      - name: Sync to VPS
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          PORT: ${{ vars.VPS_PORT || '22' }}
          DEST: ${{ vars.VPS_PATH || '/var/www/med-rhaima.me' }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $PORT -o StrictHostKeyChecking=yes" \
            .output/public/ "$USER@$HOST:$DEST/"
