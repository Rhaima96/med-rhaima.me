# /etc/nginx/sites-available/med-rhaima.me
# HTTP only to start with: `certbot --nginx` then adds HTTPS and the redirect.

server {
    listen 80;
    listen [::]:80;
    server_name med-rhaima.me www.med-rhaima.me;

    root /var/www/med-rhaima.me;
    index index.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Hashed build assets never change: cache them for a year.
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location = /og.png { expires 7d; }
    location = /CV_Mohamed_Touhami_Rhaima_FR.pdf { expires 1d; }

    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml application/xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
}
