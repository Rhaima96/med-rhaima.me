# /etc/apache2/sites-available/med-rhaima.me.conf
# HTTP only to start with: `certbot --apache` then adds the HTTPS vhost and the redirect.
# Needs: sudo a2enmod headers expires deflate

<VirtualHost *:80>
    ServerName med-rhaima.me
    ServerAlias www.med-rhaima.me
    DocumentRoot /var/www/med-rhaima.me

    <Directory /var/www/med-rhaima.me>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        DirectoryIndex index.html
    </Directory>

    ErrorDocument 404 /404.html

    # Hashed build assets never change: cache them for a year.
    <Directory /var/www/med-rhaima.me/_nuxt>
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>

    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/html "access plus 0 seconds"
        ExpiresByType image/png "access plus 7 days"
        ExpiresByType application/pdf "access plus 1 day"
    </IfModule>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css application/javascript application/json image/svg+xml application/xml text/xml
    </IfModule>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set X-Frame-Options "SAMEORIGIN"

    ErrorLog ${APACHE_LOG_DIR}/med-rhaima.me-error.log
    CustomLog ${APACHE_LOG_DIR}/med-rhaima.me-access.log combined
</VirtualHost>
